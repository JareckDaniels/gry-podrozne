name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Jave 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ustaw Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Przygotuj staly klucz podpisu
        env:
          KLUCZ: ${{ secrets.KLUCZ_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KLUCZ" ]; then
            echo "$KLUCZ" | base64 -d > ~/.android/debug.keystore
            echo "Uzyto stalego klucza z sekretu KLUCZ_B64."
            echo "NOWY_KLUCZ=nie" >> $GITHUB_ENV
          else
            echo "Brak sekretu KLUCZ_B64 - generuje nowy klucz."
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Gry podrozne, O=REIRO, C=PL"
            mkdir -p klucz
            base64 -w0 ~/.android/debug.keystore > klucz/klucz-base64.txt
            echo "NOWY_KLUCZ=tak" >> $GITHUB_ENV
          fi

      - name: Wgraj nowy klucz do zapisania w sekrecie
        if: env.NOWY_KLUCZ == 'tak'
        uses: actions/upload-artifact@v4
        with:
          name: KLUCZ-zapisz-w-sekrecie
          path: klucz/klucz-base64.txt
          retention-days: 1

      - name: Wygeneruj swiezy szkielet Androida
        run: |
          # Usuwamy folder android z repo (moze byc niespojny po wczesniejszych
          # probach) i generujemy go na nowo, dokladnie pod ta wersje Fluttera.
          # Kod gry (lib/) oraz pubspec.yaml zostaja nietkniete.
          rm -rf android
          flutter create --platforms=android --org com.example --project-name gry_podrozne .

      - name: Ustaw nazwe aplikacji
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Gry podrozne"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Podbij wersje Kotlina
        run: |
          # Swiezy szkielet Fluttera przychodzi ze starym Kotlinem, ktory nie
          # potrafi skompilowac nowszych bibliotek (np. shared_preferences).
          # Podnosimy sama wersje wtyczki Kotlina - reszty nie ruszamy.
          PLIK=android/settings.gradle
          if [ ! -f "$PLIK" ]; then PLIK=android/settings.gradle.kts; fi
          echo "=== $PLIK PRZED ==="
          cat "$PLIK"
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/' "$PLIK"
          # starszy uklad projektu (sprzed Fluttera 3.19) trzyma wersje gdzie indziej
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle
          fi
          echo "=== $PLIK PO ==="
          cat "$PLIK"
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Wgraj wlasne ikony
        run: |
          # flutter create nadpisuje ikony domyslnymi - przywracamy nasze
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ikony/mipmap-$d/ic_launcher.png \
              android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Pobierz pakiety
        run: flutter pub get

      - name: Sprawdz logike Snake
        run: dart test/snake_engine_test.dart

      - name: Sprawdz logike Arkanoida
        run: dart test/arkanoid_engine_test.dart

      - name: Sprawdz ekran Arkanoida
        run: flutter test test/arkanoid_widget_test.dart

      - name: Sprawdz Balon, Biegacza i zegary
        run: |
          dart test/arcade_engines_test.dart
          dart test/balloon_balance_test.dart
          dart test/runner_pits_test.dart
          dart test/game_timers_test.dart

      - name: Sprawdz wszystkie ekrany gier
        run: flutter test test/games_smoke_test.dart

      - name: Zbuduj APK
        run: flutter build apk --release

      - name: Wgraj APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: gry-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
