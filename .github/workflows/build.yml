name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Jave 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ustaw Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Pobierz pakiety
        run: flutter pub get

      - name: Zbuduj APK
        run: flutter build apk --release

      - name: Wgraj APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: gry-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
